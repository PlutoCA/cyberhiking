<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博徒步: 生死鳌太线</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: rgba(56, 189, 248, 0.6);
            --danger-red: rgba(239, 68, 68, 0.6);
        }
        body {
            font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            touch-action: manipulation;
        }
        /* 硬件加速加速动画 */
        .hardware-accel {
            transform: translateZ(0);
            backface-visibility: hidden;
            will-change: transform, opacity;
        }
        .cyber-panel {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(56, 189, 248, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.2);
            border-radius: 10px;
        }
        .text-neon {
            text-shadow: 0 0 10px var(--neon-blue);
        }
        .text-neon-red {
            text-shadow: 0 0 10px var(--danger-red);
        }
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(0.98); }
        }
        .animate-subtle {
            animation: subtle-pulse 2s infinite ease-in-out;
        }
    </style>
